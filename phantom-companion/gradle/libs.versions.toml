[versions]
agp = "8.10.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.11.00"
navigation = "2.8.4"
ktor = "2.3.13"
serialization = "1.7.3"
coroutines = "1.9.0"
securityCrypto = "1.1.0-alpha06"
biometric = "1.2.0-alpha05"
zxing = "3.5.3"
camerax = "1.4.0"
bouncycastle = "1.78.1"
appcompat = "1.7.0"
webkit = "1.12.0"
# Phase 1 — Identity (core-data: Room + SQLCipher Vault + profile store).
room = "2.6.1"
# HIGHWAY DOMINANCE — Android Auto (androidx.car.app). `app-projected` is the
# phone-projects-to-head-unit artifact; `app-automotive` (AAOS) is a different
# target and is deliberately not pulled in.
carApp = "1.4.0"
sqlcipher = "4.6.1"
vosk = "0.3.47"
onnxruntime = "1.31.0"
junit = "4.13.2"
robolectric = "4.13"
sqliteJdbc = "3.41.2.2"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
androidxTestCore = "1.6.1"
guava = "33.3.1-android"
mlkitBarcode = "17.3.0"
mlkitText = "16.0.1"
maplibre = "11.5.1"
filament = "1.53.1"
lottie = "6.4.0"
wear = "1.3.0"
wearCompose = "1.2.1"
playServicesWearable = "18.1.0"
playServicesLocation = "21.3.0"
playServicesNearby = "19.3.0"
playServicesBlockstore = "16.4.0"
# DA-5 (Phase 3 Integration Audit) — WorkManager exception to the
# «no new dependencies» rule. Coroutine-loop schedulers
# (StreamCleanupScheduler, NotificationDigestScheduler) die on OEM
# aggressive battery management (Samsung Sleeping Apps / Xiaomi
# MIUI / Huawei). PeriodicWorkRequest survives process kill +
# device reboot, which is the actual operator requirement for the
# 9 am notification digest.
work = "2.9.1"
# 2.0.5 — остання, що збирається на нашому Kotlin 2.0 / compileSdk 34 (2.0.7+ тягне core-ktx 1.15+).
mwa = "2.0.5"
# Google Play Billing — лише store-збірка. Play вимагає бібліотеку не старшу
# за дві основні версії: 8.x — мінімум для подач після 31.08.2026.
playBilling = "8.0.0"

