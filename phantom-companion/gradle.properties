# PHANTOM Companion — Gradle properties.
#
# Memory: the dev host has 15 GB and runs an emulator (~2.5 GB) plus an editor
# alongside the build. On 2026-07-27 it OOM-rebooted mid-session: the journal
# ends in repeated GPU-memory purges and "under memory pressure", with 12 GB
# resident and 7.2 of 8.8 GB swap consumed. Gradle 4 GB + an uncapped Kotlin
# daemon + parallel workers on 12 cores is what got there.
#
# Every JVM the build starts is now capped, and the worker count is bounded
# below the core count so parallelism cannot multiply the ceiling.
# MaxMetaspace 1g — плата за in-process Kotlin-компілятор нижче: класлоадери
# компілятора всього графа живуть у метапросторі демона, і стокові 384-512МіБ
# вмирали на повних прогонах (2026-08-23, gate-drift2).
# 3072, а не 4096: сторож `oom-guard` шле SIGTERM найбільшому процесу при
# вільній RAM < 12%; за добу 30.08 він застрелив 16 демонів Gradle, усі з
# міткою «найбільший». Купа — не розмір мішені: при -Xmx3072m і метапросторі
# 1g процес важить ~3,7 ГБ, бо JVM бере своє понад купу.
# Метапростір НЕ знижувати: 1g стоїть через in-process компілятор нижче, і
# його зниження вже вбивало повні прогони (2026-08-23).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC
# Мертвий рядок, лишений навмисно: нижче kotlin.compiler.execution.strategy=
# in-process, тож окремий Kotlin-демон не стартує і ця купа нікому не дістається.
# Якщо колись повернути стратегію "daemon" — число оживе, і його теж знижувати.
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseG1GC
# Компілятор у процесі Gradle-демона: інакше кожен worktree бере ДВА 4ГБ JVM
# (Gradle + Kotlin-демон), і три гарячі worktree кладуть 15.5ГБ машину
# (2026-08-23: серійні смерті демонів посеред збірок). Одна JVM на збірку.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4
# An idle daemon held 4.5 GB resident with no build running — stopping it by
# hand took available memory from 2.0 GB back to 8.6. Ten minutes is long
# enough to keep consecutive builds warm and short enough that walking away
# gives the machine its memory back.
org.gradle.daemon.idletimeout=600000

# AndroidX migration is non-negotiable for Compose.
android.useAndroidX=true
# Kotlin code-style for AndroidX-compat.
kotlin.code.style=official
# Cut R-class bloat — the app uses ~20 IDs total, transitive R classes are wasteful.
android.nonTransitiveRClass=true
# Parallel modules + caching keep incremental builds tolerable on aarch64.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# NOTE: the aapt2 override below was only needed on the aarch64 Radxa/Ubuntu host,
# where AGP's bundled aapt2 (x86_64-only) could not run. This machine IS x86_64,
# so AGP's bundled aapt2 works natively — override disabled on purpose.
# android.aapt2FromMavenOverride=/usr/lib/android-sdk/build-tools/debian/aapt2
# Don't try to stream artifacts the host can't run.
android.injected.testOnly=false

# Дві JVM по 4ГБ на worktree душать машину при кількох гарячих деревах —
# компілятор у купі Gradle-демона (знахідка ATLAS, підтверджена падінням).
kotlin.compiler.execution.strategy=in-process
