name: CI

# JVM unit tests for every module + both app flavors, plus the drift firewalls.
# No emulator: these are the fast, deterministic gate. Instrumented tests are a
# separate, slower concern (not wired yet — see the repo's open follow-ups).

on:
  push:
    branches: [main, "rebuild/**", "companion-**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      # The suite has locale-sensitive formatters (the uk_UA host-migration
      # bug: `%.1f` → «1,2» vs «1.2»). Production code is Locale.ROOT-pinned
      # now, but pin the whole run to a dot-decimal locale as belt-and-braces —
      # C.UTF-8 is always present on the runner.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME set,
      # licenses accepted, platform-34 + build-tools present) — enough for
      # `testDebugUnitTest`, which builds but runs on the JVM. No emulator.

      # GATE — both app flavors, or :app is silently skipped. With product
      # flavors, `testDebugUnitTest` resolves to nothing for :app; the two
      # explicit flavor tasks are the only way :app's unit tests run.
      - name: Unit tests (all modules + both flavors)
        run: >
          ./gradlew --no-daemon --stacktrace
          testDebugUnitTest
          :app:testFieldDebugUnitTest
          :app:testStoreDebugUnitTest
          --continue

      # The motion/shape/lifecycle drift firewalls read sibling modules' sources
      # as raw file I/O, invisible to Gradle's up-to-date check — a cached run
      # shows a stale green. --rerun forces them.
      - name: Drift firewalls (forced rerun)
        run: ./gradlew --no-daemon :core-design:testDebugUnitTest --rerun

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
