[package]
name = "nightpost_bill"
version = "0.1.0"
description = "Nightpost group bill escrow on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nightpost_bill"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"

[dev-dependencies]
litesvm = "0.18"
solana-account = "4.7"
solana-instruction-error = "2.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = { version = "4.3", features = ["wincode"] }
solana-transaction-error = "3.4"
