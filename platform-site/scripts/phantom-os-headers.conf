add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), display-capture=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# CSP не було ні в netlify.toml, ні в <meta> — тобто сторінка безпеки називала
# заборони, яких браузер не бачив. Перелік складений з того, що сайт СПРАВДІ
# робить: шрифти й скрипти власні (@fontsource у бандлі), єдиний вихід у мережу —
# /api/downloads і /api/download/link на ліцензійному сервері. 'unsafe-inline'
# на стилях більше не потрібен: framer-motion, що ставив їх атрибутом, із сайту
# прибрано (01.10), а стилі React ідуть через CSSOM, якого CSP не забороняє.
#
# `data:` у font-src — не послаблення, а вимір. Перший рядок був без нього, і
# сторінка, відкрита під ним, втратила ВСІ шрифти: Vite вшиває дрібні накреслення
# просто в CSS як data:-адреси, тож заборона зрізала власну ж типографіку.
# Помилка тиха — код 200, `nginx -t` зелений, скарга лише в консолі браузера.
# Тому CSP не можна ухвалювати читанням: цей рядок стоїть тут після того, як
# сторінку відкрили під ним і подивились.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https://phantom-license.fly.dev https://api.phantom-os.dev https://*.r2.cloudflarestorage.com; font-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://phantom-license.fly.dev https://api.phantom-os.dev https://api.devnet.solana.com https://*.r2.cloudflarestorage.com; frame-src https://www.youtube-nocookie.com; upgrade-insecure-requests" always;
