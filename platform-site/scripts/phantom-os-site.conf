include snippets/phantom-os-headers.conf;

# Заголовки доводиться повторювати в КОЖНОМУ location, і це не недбалість:
# `add_header` у вкладеному блоці скасовує геть усі успадковані. Один
# `add_header Cache-Control` у location знімає і CSP, і Permissions-Policy —
# мовчки, з кодом 200 і зеленим `nginx -t`.
location /assets/ {
    include snippets/phantom-os-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~ ^/venues/[^/]+/media(-session|/) {
    include snippets/phantom-os-headers.conf;
    proxy_pass https://api.phantom-os.dev;
    proxy_ssl_server_name on;
    proxy_set_header Host api.phantom-os.dev;
}

# Маршрутизатор на клієнті володіє кожним шляхом — той самий рядок, що в
# netlify.toml. Без нього перезавантаження на /security віддає 404.
location / {
    include snippets/phantom-os-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
